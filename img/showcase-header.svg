<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Warehouse Manager</title>
  <desc id="desc">Dispatch, returns &amp; recovered stock. Navy and cyan showcase header with a subtle eighteen-second border highlight.</desc>
  <defs>
