<title id="title">Warehouse Manager — Application architecture</title>
<desc id="desc">A browser connects to the central Django application. OData exports pass through preparation and import into SQLite. Django accesses file storage and generates DOCX vouchers, which LibreOffice converts to PDF.</desc>
